<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer tyre tread ring -->
  <circle cx="16" cy="16" r="15" fill="#111111"/>
  <!-- Tread notches (white cuts) -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="white" stroke-width="0.5" stroke-dasharray="2.2 1.5" stroke-dashoffset="0"/>
  <!-- Sidewall (inner white ring) -->
  <circle cx="16" cy="16" r="11.5" fill="white"/>
  <!-- Inner rubber wall -->
  <circle cx="16" cy="16" r="10.5" fill="#111111"/>
  <!-- Alloy rim -->
  <circle cx="16" cy="16" r="7.5" fill="white"/>
  <!-- Spokes -->
  <g stroke="#111111" stroke-width="1.6" stroke-linecap="round">
    <line x1="16" y1="9" x2="16" y2="13.5"/>
    <line x1="16" y1="23" x2="16" y2="18.5"/>
    <line x1="9" y1="16" x2="13.5" y2="16"/>
    <line x1="23" y1="16" x2="18.5" y2="16"/>
    <line x1="11.1" y1="11.1" x2="14.2" y2="14.2"/>
    <line x1="20.9" y1="20.9" x2="17.8" y2="17.8"/>
    <line x1="20.9" y1="11.1" x2="17.8" y2="14.2"/>
    <line x1="11.1" y1="20.9" x2="14.2" y2="17.8"/>
  </g>
  <!-- Centre hub -->
  <circle cx="16" cy="16" r="2.2" fill="#111111"/>
  <circle cx="16" cy="16" r="1" fill="white"/>
</svg>
